# Watchlist configuration — edit this file to add/remove tickers or adjust your
# personal targets / P/E / status without touching code.
#
# Live fields (refreshed daily by `make ingest-watchlist`):
#   - current price
#   - 30-day return
#   - 30-day return relative to the benchmark
#   - 30-day price sparkline
#
# Manual fields (refresh quarterly with earnings or whenever your view changes):
#   - target_price : your personal price target, not analyst consensus
#   - fwd_pe       : forward P/E as a display string (e.g. "12.4×"). Analyst-
#                    consensus forward P/E isn't available on free tiers
#                    (Yahoo's quoteSummary endpoint requires the crumb-auth
#                    wall that breaks yfinance), so this stays manual.
#   - status       : "watching" | "starter" | "building"

